<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark light"><title>Nearby Places</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;background:#171923;color:#f7f7fb}body{margin:0 auto;max-width:740px;padding:24px 16px}h1{font-size:1.6rem}button,input,select{font:inherit;padding:10px;border-radius:8px}button{border:0;background:#0aa37f;color:white}button:disabled{opacity:.5}.muted{color:#a9b0c0}.place{padding:16px;margin:12px 0;background:#292d3c;border-radius:12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.tag{font-size:.8rem;color:#a9b0c0}#status{padding:12px;background:#292d3c;border-radius:8px}
</style></head><body><h1>Nearby Places</h1><p class="muted">Catalogue de lieux · prototype hors ligne · test GPS au premier plan uniquement</p><p id="status" role="status">Chargement…</p><button id="locate">Tester ma position</button> <button id="refresh">Actualiser GitHub</button> <button id="reset">Réinitialiser les lieux</button><h2>Mes lieux</h2><div id="places"></div><h2>Ajouter un lieu</h2><p><input id="name" placeholder="Nom" aria-label="Nom"><input id="lat" type="number" step="any" placeholder="Latitude" aria-label="Latitude"><input id="lon" type="number" step="any" placeholder="Longitude" aria-label="Longitude"><select id="category"><option value="culture">Culture</option><option value="resto">Restaurant</option><option value="musique">Musique</option><option value="transport">Transport</option><option value="occasion">Occasion</option><option value="modelisme">Modélisme</option></select><button id="add">Ajouter</button></p><p class="muted">Les notifications et la surveillance permanente écran verrouillé nécessitent le futur plugin natif Swift/Kotlin ; elles ne sont pas encore implémentées.</p><script src="cordova.js"></script><script src="js/app.js"></script></body></html>
