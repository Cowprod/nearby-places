name: Nearby Places - JavaScript tests

on:
  push:
    branches: [main, feat/ui-collections-foundation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # The committed lockfile predates local PhotoKit/UI dependencies.
      # Do not block test execution on an invalid frozen lockfile.
      - name: Install declared dependencies
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Run model, compatibility and iOS share-extension tests
        run: npm test
