name: Node tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # The devMcp workspace does not currently expose dependency installation.
      # CI installs the declared test deps (plist, xcode) without Cordova hooks.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test complete Node suite
        run: npm test
