name: Node tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # The checked-in lockfile predates the photos plugin and several UI packages.
      # Until a full lockfile regeneration, npm ci would fail before running tests.
      # Install from package.json without rewriting the stale lockfile in CI.
      - name: Install dependencies
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Test complete Node suite
        run: npm test
